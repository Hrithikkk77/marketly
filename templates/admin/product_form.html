{% extends "base.html" %}{% block content %}<h1>{{ 'Edit' if p.id else 'Add' }} product</h1>
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Name<input name="name" value="{{ p.name or '' }}" required></label>
<label>Category<select name="category_id">{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if c.id==p.category_id }}>{{ c.name }}</option>{% endfor %}</select></label>
<label>Price (₹)<input name="price" type="number" step="0.01" min="0" value="{{ p.price or '' }}" required></label>
<label>Stock<input name="stock" type="number" min="0" value="{{ p.stock if p.stock is not none else '' }}" required></label>
<label>Image URL<input name="image_url" value="{{ p.image_url or '' }}"></label>
<label>Description<textarea name="description" rows="4">{{ p.description or '' }}</textarea></label>
<button>Save product</button></form>{% endblock %}
