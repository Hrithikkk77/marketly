<div class="card"><a href="{{ url_for('product', pid=p.id) }}"><div class="img">{% if p.image_url %}<img src="{{ p.image_url }}" alt="">{% else %}{{ p.name[0] }}{% endif %}</div></a>
<div class="body"><a class="t" href="{{ url_for('product', pid=p.id) }}">{{ p.name }}</a><div class="price">{{ p.price|money }}</div>
<div class="muted">{% if p.stock %}{{ p.stock }} in stock{% else %}Out of stock{% endif %}</div></div></div>
