{% extends "base.html" %}{% block content %}
<h1>{{ 'Create your account' if mode=='register' else 'Sign in' }}</h1>
<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if mode=='register' %}<label>Name<input name="name" required></label>{% endif %}
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required {% if mode=='register' %}minlength="8"{% endif %}></label>
<button>{{ 'Create account' if mode=='register' else 'Sign in' }}</button></form>
<p>{% if mode=='register' %}Have an account? <a href="{{ url_for('login') }}">Sign in</a>{% else %}New here? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p>
{% endblock %}
